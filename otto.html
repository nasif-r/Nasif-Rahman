<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>The Ottoman Empire — 3D</title>

    <link rel="stylesheet" href="otto.css">

</head>


<body>

    <!-- ==========================
         3D WORLD
    ========================== -->

    <div id="world"></div>


    <!-- ==========================
         INTRO SCREEN
    ========================== -->

    <div id="intro">

        <div class="intro-content">

            <p class="year">
                1299
            </p>

            <h1>
                THE OTTOMAN EMPIRE
            </h1>

            <p class="subtitle">
               THE LEGACY OF OSMAN
            </p>

            <button id="enter-btn">
                ENTER THE WORLD
            </button>

        </div>

    </div>


    <!-- ==========================
         INFORMATION PANEL
    ========================== -->

    <div id="info-panel">

        <button id="close-btn">
            ×
        </button>

        <h2 id="info-title">
            Location
        </h2>

        <p id="info-text">
            Historical information will appear here.
        </p>

    </div>


    <!-- ==========================
         THREE.JS IMPORT MAP
    ========================== -->

    <script type="importmap">

    {
        "imports": {
            "three":
            "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }

    </script>


    <!-- ==========================
         MAIN MODULE
    ========================== -->

    <script type="module">

        import * as THREE from "three";

        import {
            OrbitControls
        } from
        "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


        /* ==========================
           SCENE
        ========================== */

        const scene =
            new THREE.Scene();

        scene.background =
            new THREE.Color(
                0x0b0b0b
            );


        /* ==========================
           CAMERA
        ========================== */

        const camera =
            new THREE.PerspectiveCamera(
                60,
                window.innerWidth /
                window.innerHeight,
                0.1,
                1000
            );

        camera.position.set(
            0,
            16,
            24
        );


        /* ==========================
           RENDERER
        ========================== */

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true
            });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );

        document
            .getElementById("world")
            .appendChild(
                renderer.domElement
            );


        /* ==========================
           ORBIT CONTROLS
        ========================== */

        const controls =
            new OrbitControls(
                camera,
                renderer.domElement
            );

        controls.enableDamping =
            true;

        controls.dampingFactor =
            0.05;

        controls.minDistance =
            8;

        controls.maxDistance =
            70;

        controls.maxPolarAngle =
            Math.PI / 2.15;

        controls.target.set(
            0,
            0,
            0
        );


        /* ==========================
           LIGHTING
        ========================== */

        const ambientLight =
            new THREE.AmbientLight(
                0xffffff,
                1
            );

        scene.add(
            ambientLight
        );


        const sun =
            new THREE.DirectionalLight(
                0xffffff,
                2
            );

        sun.position.set(
            10,
            20,
            10
        );

        scene.add(
            sun
        );


        /* ==========================
           TERRAIN
        ========================== */

        const terrainGeometry =
            new THREE.PlaneGeometry(
                100,
                100,
                20,
                20
            );

        const terrainMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x6d7355,
                roughness: 1
            });

        const terrain =
            new THREE.Mesh(
                terrainGeometry,
                terrainMaterial
            );

        terrain.rotation.x =
            -Math.PI / 2;

        scene.add(
            terrain
        );


        /* ==========================
           RIVER
        ========================== */

        const riverCurve =
            new THREE.CatmullRomCurve3([

                new THREE.Vector3(
                    -42,
                    0.05,
                    -35
                ),

                new THREE.Vector3(
                    -30,
                    0.05,
                    -20
                ),

                new THREE.Vector3(
                    -25,
                    0.05,
                    -5
                ),

                new THREE.Vector3(
                    -30,
                    0.05,
                    10
                ),

                new THREE.Vector3(
                    -20,
                    0.05,
                    25
                ),

                new THREE.Vector3(
                    -5,
                    0.05,
                    38
                ),

                new THREE.Vector3(
                    10,
                    0.05,
                    45
                )

            ]);


        const riverGeometry =
            new THREE.TubeGeometry(
                riverCurve,
                80,
                1.2,
                8,
                false
            );


        const riverMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x263f52,
                roughness: 0.25,
                metalness: 0.3
            });


        const river =
            new THREE.Mesh(
                riverGeometry,
                riverMaterial
            );

        scene.add(
            river
        );


        /* ==========================
           NATURAL MOUNTAINS
        ========================== */

        function createMountain(
            x,
            z,
            size,
            height
        ) {

            const geometry =
                new THREE.ConeGeometry(
                    size,
                    height,
                    7,
                    3
                );


            const material =
                new THREE.MeshStandardMaterial({
                    color: 0x3f4638,
                    roughness: 1
                });


            const mountain =
                new THREE.Mesh(
                    geometry,
                    material
                );


            mountain.position.set(
                x,
                height / 2,
                z
            );


            mountain.rotation.y =
                Math.random() *
                Math.PI;


            mountain.scale.x =
                0.8 +
                Math.random() *
                0.7;


            mountain.scale.z =
                0.8 +
                Math.random() *
                0.7;


            scene.add(
                mountain
            );

        }


        /* ==========================
           WESTERN MOUNTAIN RANGE
        ========================== */

        const westernRange = [

            [-35, -25, 3.5, 6],
            [-30, -20, 4.5, 8],
            [-26, -15, 3, 5],
            [-22, -10, 5, 9],
            [-20, -3, 3.5, 6],
            [-24, 5, 4.5, 8],
            [-28, 13, 3, 5],
            [-32, 20, 5, 9],
            [-27, 28, 3.5, 6]

        ];


        westernRange.forEach(
            ([x, z, size, height]) => {

                createMountain(
                    x,
                    z,
                    size,
                    height
                );

            }
        );


        /* ==========================
           NORTHERN MOUNTAIN RANGE
        ========================== */

        const northernRange = [

            [-15, -35, 4, 7],
            [-7, -33, 3, 5],
            [1, -35, 5, 9],
            [10, -32, 3.5, 6],
            [18, -34, 4.5, 8],
            [27, -30, 3, 5],
            [34, -27, 4, 7]

        ];


        northernRange.forEach(
            ([x, z, size, height]) => {

                createMountain(
                    x,
                    z,
                    size,
                    height
                );

            }
        );


        /* ==========================
           OTTOMAN TERRITORY — 1299
        ========================== */

        const ottomanShape =
            new THREE.Shape();


        ottomanShape.moveTo(
            -10,
            -8
        );

        ottomanShape.lineTo(
            -3,
            -10
        );

        ottomanShape.lineTo(
            5,
            -8
        );

        ottomanShape.lineTo(
            9,
            -3
        );

        ottomanShape.lineTo(
            7,
            4
        );

        ottomanShape.lineTo(
            2,
            8
        );

        ottomanShape.lineTo(
            -6,
            7
        );

        ottomanShape.lineTo(
            -10,
            2
        );

        ottomanShape.lineTo(
            -12,
            -3
        );

        ottomanShape.lineTo(
            -10,
            -8
        );


        const territoryGeometry =
            new THREE.ShapeGeometry(
                ottomanShape
            );


        const territoryMaterial =
            new THREE.MeshStandardMaterial({

                color: 0x5b241f,

                transparent: true,

                opacity: 0.75,

                side: THREE.DoubleSide

            });


        const ottomanTerritory =
            new THREE.Mesh(
                territoryGeometry,
                territoryMaterial
            );


        ottomanTerritory.rotation.x =
            -Math.PI / 2;


        ottomanTerritory.position.y =
            0.08;


        scene.add(
            ottomanTerritory
        );


        /* ==========================
           BYZANTINE TERRITORY — 1299
        ========================== */

        const byzantineShape =
            new THREE.Shape();


        byzantineShape.moveTo(
            12,
            -12
        );

        byzantineShape.lineTo(
            24,
            -10
        );

        byzantineShape.lineTo(
            34,
            -4
        );

        byzantineShape.lineTo(
            37,
            5
        );

        byzantineShape.lineTo(
            32,
            13
        );

        byzantineShape.lineTo(
            22,
            17
        );

        byzantineShape.lineTo(
            14,
            12
        );

        byzantineShape.lineTo(
            10,
            4
        );

        byzantineShape.lineTo(
            12,
            -12
        );


        const byzantineGeometry =
            new THREE.ShapeGeometry(
                byzantineShape
            );


        const byzantineMaterial =
            new THREE.MeshStandardMaterial({

                color: 0x51485f,

                transparent: true,

                opacity: 0.65,

                side: THREE.DoubleSide

            });


        const byzantineTerritory =
            new THREE.Mesh(
                byzantineGeometry,
                byzantineMaterial
            );


        byzantineTerritory.rotation.x =
            -Math.PI / 2;


        byzantineTerritory.position.y =
            0.07;


        scene.add(
            byzantineTerritory
        );


        /* ==========================
           HISTORICAL LABELS
        ========================== */

        function createLabel(
            text,
            x,
            y,
            z
        ) {

            const canvas =
                document.createElement(
                    "canvas"
                );


            const context =
                canvas.getContext(
                    "2d"
                );


            canvas.width =
                512;

            canvas.height =
                128;


            context.font =
                "bold 42px Georgia";


            context.fillStyle =
                "#e7d7b0";


            context.textAlign =
                "center";


            context.fillText(
                text,
                256,
                75
            );


            const texture =
                new THREE.CanvasTexture(
                    canvas
                );


            const material =
                new THREE.SpriteMaterial({

                    map: texture,

                    transparent: true

                });


            const sprite =
                new THREE.Sprite(
                    material
                );


            sprite.position.set(
                x,
                y,
                z
            );


            sprite.scale.set(
                6,
                1.5,
                1
            );


            scene.add(
                sprite
            );


            return sprite;

        }


        createLabel(
            "OTTOMAN STATE-1299",
            -1,
            5,
            1.05
        );


        createLabel(
            "SÖĞÜT",
            -3,
            1.7,
            -2
        );


        createLabel(
            "BİLECİK",
            2,
            1.7,
            1
        );


        createLabel(
            "BYZANTINE TERRITORIES",
            23,
            2.5,
            2
        );


        /* ==========================
           HISTORICAL ROADS
        ========================== */

        function createRoad(
            points
        ) {

            const roadCurve =
                new THREE.CatmullRomCurve3(

                    points.map(
                        point =>
                            new THREE.Vector3(
                                point[0],
                                0.12,
                                point[1]
                            )
                    )

                );


            const roadGeometry =
                new THREE.TubeGeometry(
                    roadCurve,
                    40,
                    0.08,
                    5,
                    false
                );


            const roadMaterial =
                new THREE.MeshStandardMaterial({

                    color: 0x574938,

                    roughness: 1

                });


            const road =
                new THREE.Mesh(
                    roadGeometry,
                    roadMaterial
                );


            scene.add(
                road
            );

        }


        /* Söğüt → Bilecik */

        createRoad([

            [-3, -2],
            [-2, -1],
            [-1, 0],
            [0, 0.5],
            [2, 1]

        ]);


        /* Söğüt → Western Frontier */

        createRoad([

            [-3, -2],
            [-8, -4],
            [-14, -7],
            [-20, -10]

        ]);


        /* Bilecik → Northern Route */

        createRoad([

            [2, 1],
            [5, 5],
            [8, 10],
            [12, 15]

        ]);


        /* ==========================
           MEDIEVAL FORESTS
        ========================== */

        function createTree(
            x,
            z,
            scale = 1
        ) {

            const trunkGeometry =
                new THREE.CylinderGeometry(
                    0.12 * scale,
                    0.18 * scale,
                    0.7 * scale,
                    6
                );


            const trunkMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x4a3828
                });


            const trunk =
                new THREE.Mesh(
                    trunkGeometry,
                    trunkMaterial
                );


            trunk.position.set(
                x,
                0.35 * scale,
                z
            );


            scene.add(
                trunk
            );


            const leavesGeometry =
                new THREE.ConeGeometry(
                    0.55 * scale,
                    1.5 * scale,
                    7
                );


            const leavesMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x31452f
                });


            const leaves =
                new THREE.Mesh(
                    leavesGeometry,
                    leavesMaterial
                );


            leaves.position.set(
                x,
                1.25 * scale,
                z
            );


            scene.add(
                leaves
            );

        }


        const forests = [

            [-18, -22],
            [-15, -19],
            [-20, -18],
            [-17, -15],
            [-13, -21],

            [15, 20],
            [18, 22],
            [21, 19],
            [17, 16],
            [23, 23],

            [30, 5],
            [32, 8],
            [28, 10],
            [34, 12]

        ];


        forests.forEach(
            ([x, z]) => {

                createTree(
                    x,
                    z,
                    0.8 +
                    Math.random() * 0.6
                );

            }
        );


        /* ==========================
           MEDIEVAL VILLAGES
        ========================== */

        function createVillage(
            x,
            z,
            name
        ) {

            const villageGroup =
                new THREE.Group();


            for (
                let i = 0;
                i < 5;
                i++
            ) {

                const houseGeometry =
                    new THREE.BoxGeometry(
                        0.8,
                        0.6,
                        0.8
                    );


                const houseMaterial =
                    new THREE.MeshStandardMaterial({
                        color: 0x765d43
                    });


                const house =
                    new THREE.Mesh(
                        houseGeometry,
                        houseMaterial
                    );


                house.position.set(

                    (Math.random() - 0.5) * 3,

                    0.3,

                    (Math.random() - 0.5) * 3

                );


                villageGroup.add(
                    house
                );

            }


            villageGroup.position.set(
                x,
                0,
                z
            );


            scene.add(
                villageGroup
            );

        }


        createVillage(
            -8,
            -5,
            "Frontier Village"
        );


        createVillage(
            7,
            8,
            "Northern Village"
        );


        createVillage(
            -18,
            8,
            "Western Village"
        );


        /* ==========================
           MEDIEVAL FORTRESS
        ========================== */

        function createFortress(
            x,
            z
        ) {

            const fortress =
                new THREE.Group();


            const wallMaterial =
                new THREE.MeshStandardMaterial({

                    color: 0x6b6252,

                    roughness: 1

                });


            /* Main Walls */

            const wallGeometry =
                new THREE.BoxGeometry(
                    5,
                    1.8,
                    4
                );


            const wall =
                new THREE.Mesh(
                    wallGeometry,
                    wallMaterial
                );


            wall.position.y =
                0.9;


            fortress.add(
                wall
            );


            /* Towers */

            const towerGeometry =
                new THREE.CylinderGeometry(
                    0.65,
                    0.8,
                    3,
                    8
                );


            const towerPositions = [

                [-2.1, -1.6],
                [2.1, -1.6],
                [-2.1, 1.6],
                [2.1, 1.6]

            ];


            towerPositions.forEach(
                ([tx, tz]) => {

                    const tower =
                        new THREE.Mesh(
                            towerGeometry,
                            wallMaterial
                        );


                    tower.position.set(
                        tx,
                        1.5,
                        tz
                    );


                    fortress.add(
                        tower
                    );

                }
            );


            /* Central Keep */

            const keepGeometry =
                new THREE.BoxGeometry(
                    1.8,
                    3,
                    1.8
                );


            const keep =
                new THREE.Mesh(
                    keepGeometry,
                    wallMaterial
                );


            keep.position.y =
                1.5;


            fortress.add(
                keep
            );


            /* Banner Pole */

            const bannerGeometry =
                new THREE.BoxGeometry(
                    0.05,
                    2,
                    0.05
                );


            const bannerMaterial =
                new THREE.MeshStandardMaterial({

                    color: 0x321714

                });


            const bannerPole =
                new THREE.Mesh(
                    bannerGeometry,
                    bannerMaterial
                );


            bannerPole.position.set(
                0,
                4,
                0
            );


            fortress.add(
                bannerPole
            );


            fortress.position.set(
                x,
                0,
                z
            );


            scene.add(
                fortress
            );


            return fortress;

        }


        const fortress =
            createFortress(
                -7,
                -1
            );


        fortress.userData.location =
            "fortress";


        /* ==========================
           OTTOMAN FLAG
        ========================== */

        const flagPoleGeometry =
            new THREE.CylinderGeometry(
                0.05,
                0.05,
                3,
                8
            );


        const flagPoleMaterial =
            new THREE.MeshStandardMaterial({

                color: 0x6b5438

            });


        const flagPole =
            new THREE.Mesh(
                flagPoleGeometry,
                flagPoleMaterial
            );


        flagPole.position.set(
            -7,
            5,
            -1
        );


        scene.add(
            flagPole
        );


        const flagGeometry =
            new THREE.PlaneGeometry(
                1.5,
                0.9
            );


        const flagMaterial =
            new THREE.MeshStandardMaterial({

                color: 0x6d1f1f,

                side: THREE.DoubleSide

            });


        const flag =
            new THREE.Mesh(
                flagGeometry,
                flagMaterial
            );


        flag.position.set(
            -6.3,
            5.6,
            -1
        );


        scene.add(
            flag
        );


        /* ==========================
           MINARET
        ========================== */

        const minaretGeometry =
            new THREE.CylinderGeometry(
                0.25,
                0.35,
                3.5,
                8
            );


        const minaretMaterial =
            new THREE.MeshStandardMaterial({

                color: 0x817563,

                roughness: 0.9

            });


        const minaret =
            new THREE.Mesh(
                minaretGeometry,
                minaretMaterial
            );


        minaret.position.set(
            -4.5,
            1.75,
            -0.5
        );


        scene.add(
            minaret
        );


        /* Minaret Top */

        const minaretTopGeometry =
            new THREE.ConeGeometry(
                0.38,
                0.8,
                8
            );


        const minaretTop =
            new THREE.Mesh(
                minaretTopGeometry,
                minaretMaterial
            );


        minaretTop.position.set(
            -4.5,
            3.9,
            -0.5
        );


        scene.add(
            minaretTop
        );


        /* ==========================
           SÖĞÜT — 1299
        ========================== */

        const sogutGeometry =
            new THREE.CylinderGeometry(
                0.7,
                0.9,
                0.8,
                8
            );


        const sogutMaterial =
            new THREE.MeshStandardMaterial({

                color: 0xb08a52

            });


        const sogut =
            new THREE.Mesh(
                sogutGeometry,
                sogutMaterial
            );


        sogut.position.set(
            -3,
            0.5,
            -2
        );


        sogut.userData.location =
            "sogut";


        scene.add(
            sogut
        );


        /* ==========================
           BİLECİK
        ========================== */

        const bilecikGeometry =
            new THREE.CylinderGeometry(
                0.6,
                0.8,
                0.7,
                8
            );


        const bilecikMaterial =
            new THREE.MeshStandardMaterial({

                color: 0x9b7650

            });


        const bilecik =
            new THREE.Mesh(
                bilecikGeometry,
                bilecikMaterial
            );


        bilecik.position.set(
            2,
            0.45,
            1
        );


        bilecik.userData.location =
            "bilecik";


        scene.add(
            bilecik
        );


        /* ==========================
           CENTRAL SETTLEMENT
        ========================== */

        const cityGeometry =
            new THREE.CylinderGeometry(
                2.5,
                3,
                0.6,
                8
            );


        const cityMaterial =
            new THREE.MeshStandardMaterial({

                color: 0x8b7355

            });


        const city =
            new THREE.Mesh(
                cityGeometry,
                cityMaterial
            );


        city.position.y =
            0.3;


        city.position.z =
            -2;


        scene.add(
            city
        );


        /* ==========================
           CITY TOWERS
        ========================== */

        for (
            let i = 0;
            i < 6;
            i++
        ) {

            const towerGeometry =
                new THREE.BoxGeometry(
                    0.6,
                    1.5 +
                    Math.random(),
                    0.6
                );


            const towerMaterial =
                new THREE.MeshStandardMaterial({

                    color: 0x66503b

                });


            const tower =
                new THREE.Mesh(
                    towerGeometry,
                    towerMaterial
                );


            tower.position.set(

                city.position.x +
                Math.cos(i) * 2,

                0.8,

                city.position.z +
                Math.sin(i) * 2

            );


            scene.add(
                tower
            );

        }


        /* ==========================
           CLICK DETECTION
        ========================== */

        const raycaster =
            new THREE.Raycaster();


        const mouse =
            new THREE.Vector2();


        window.addEventListener(
            "click",
            (event) => {

                mouse.x =
                    (
                        event.clientX /
                        window.innerWidth
                    ) * 2 - 1;


                mouse.y =
                    -(
                        event.clientY /
                        window.innerHeight
                    ) * 2 + 1;


                raycaster.setFromCamera(
                    mouse,
                    camera
                );


                const intersects =
                    raycaster.intersectObjects(

                        [
                            sogut,
                            bilecik,
                            fortress
                        ],

                        true

                    );


                if (
                    intersects.length === 0
                ) {

                    return;

                }


                const clickedObject =
                    intersects[0].object;


                /* ==========================
                   FORTRESS
                ========================== */

                if (
                    clickedObject === fortress ||
                    clickedObject.parent === fortress
                ) {

                    document
                        .getElementById(
                            "info-title"
                        )
                        .textContent =
                        "FRONTIER FORTRESS";


                    document
                        .getElementById(
                            "info-text"
                        )
                        .innerHTML =
                        "A stylized representation of a frontier fortress in the world of the early Ottoman state.";

                }


                /* ==========================
                   SÖĞÜT
                ========================== */

                else if (
                    clickedObject === sogut
                ) {

                    document
                        .getElementById(
                            "info-title"
                        )
                        .textContent =
                        "SÖĞÜT — 1299";


                    document
                        .getElementById(
                            "info-text"
                        )
                        .innerHTML =
                        "Söğüt was the early base of Osman I and an important center of the emerging Ottoman frontier.";

                }


                /* ==========================
                   BİLECİK
                ========================== */

                else if (
                    clickedObject === bilecik
                ) {

                    document
                        .getElementById(
                            "info-title"
                        )
                        .textContent =
                        "BİLECİK";


                    document
                        .getElementById(
                            "info-text"
                        )
                        .innerHTML =
                        "Bilecik and its surrounding region were important to the early expansion of the Ottoman frontier.";

                }


                document
                    .getElementById(
                        "info-panel"
                    )
                    .classList.add(
                        "show"
                    );

            }
        );


        /* ==========================
           ANIMATION
        ========================== */

        function animate() {

            requestAnimationFrame(
                animate
            );


            controls.update();


            renderer.render(
                scene,
                camera
            );

        }


        animate();


        /* ==========================
           RESIZE
        ========================== */

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        /* ==========================
           ENTER WORLD
        ========================== */

        const enterButton =
            document.getElementById(
                "enter-btn"
            );


        const intro =
            document.getElementById(
                "intro"
            );


        enterButton.addEventListener(
            "click",
            () => {

                intro.classList.add(
                    "hidden"
                );

            }
        );


        /* ==========================
           CLOSE INFO
        ========================== */

        document
            .getElementById(
                "close-btn"
            )
            .addEventListener(
                "click",
                () => {

                    document
                        .getElementById(
                            "info-panel"
                        )
                        .classList.remove(
                            "show"
                        );

                }
            );

    </script>
